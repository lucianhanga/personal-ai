[project]
name = "personalai-provider-whisper-local"
version = "0.0.0"
description = "PersonalAI Transcriber adapter: in-process local Whisper via faster-whisper (CTranslate2)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lucian Hanga" }]
dependencies = ["personalai-contracts", "faster-whisper>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personalai_provider_whisper_local"]

[tool.uv.sources]
personalai-contracts = { workspace = true }
