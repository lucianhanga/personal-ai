[project]
name = "personalai-provider-openai"
version = "0.0.0"
description = "PersonalAI ModelProvider adapter for OpenAI-compatible APIs (OpenAI, Azure, vLLM, ...)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lucian Hanga" }]
dependencies = ["personalai-contracts", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personalai_provider_openai"]

[tool.uv.sources]
personalai-contracts = { workspace = true }
