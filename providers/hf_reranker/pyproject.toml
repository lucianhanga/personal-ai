[project]
name = "personalai-provider-hf-reranker"
version = "0.0.0"
description = "PersonalAI Reranker adapter: in-process Qwen3-Reranker via HuggingFace Transformers (#492)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lucian Hanga" }]
dependencies = ["personalai-contracts"]

# Heavy ML stack is opt-in: the rerank stage is flag-gated, so torch/transformers are
# only needed when reranking is actually enabled. Install with `uv sync --extra ml`.
[project.optional-dependencies]
ml = ["transformers>=4.51", "torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personalai_provider_hf_reranker"]

[tool.uv.sources]
personalai-contracts = { workspace = true }
