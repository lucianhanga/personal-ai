[project]
name = "personalai-tool-builtin"
version = "0.0.0"
description = "PersonalAI built-in tools (calculator, http_fetch) behind the gateway."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lucian Hanga" }]
dependencies = ["personalai-contracts", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personalai_tool_builtin"]

[tool.uv.sources]
personalai-contracts = { workspace = true }
