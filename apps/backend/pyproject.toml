[project]
name = "personalai-backend"
version = "0.8.3"
description = "PersonalAI backend app: FastAPI composition root wiring adapters via registries."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lucian Hanga" }]
dependencies = [
    "personalai-contracts",
    "personalai-core",
    "personalai-provider-ollama",
    "personalai-provider-openai",
    "personalai-provider-whisper-local",
    "personalai-modality-files",
    "personalai-storage-postgres",
    "personalai-tool-builtin",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
    # langchain-core: the RAG retriever/embeddings adapter interfaces (#420 PR2, ADR-0012). Already
    # present transitively via LangGraph at 1.4.6 -> promoted to a pinned DIRECT dep. CVE-2025-68664
    # ("LangGrinch") is patched in our >=1.2.5 line; we never call load()/loads() on untrusted data.
    # We deliberately do NOT add langchain / -community / -postgres / -ollama (see SUPPLY-CHAIN.md).
    "langchain-core>=1.4,<2",
    # watchdog: cross-platform filesystem watcher (FSEvents/inotify/ReadDirectoryChangesW + a polling
    # fallback) for Settings->Documents folder sync (#456). Pure-Python, Apache-2.0, no native build.
    # The sync worker is local-only/fail-closed; the watcher merely observes the user's granted folders.
    "watchdog>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personalai_backend"]

[tool.uv.sources]
personalai-contracts = { workspace = true }
personalai-core = { workspace = true }
personalai-provider-ollama = { workspace = true }
personalai-provider-openai = { workspace = true }
personalai-provider-whisper-local = { workspace = true }
personalai-modality-files = { workspace = true }
personalai-storage-postgres = { workspace = true }
personalai-tool-builtin = { workspace = true }
