name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-health:
    name: Repository health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required governance files exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "LICENSE"
            "SECURITY.md"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
            "docs/architecture/PersonalAI-Architecture-Research.md"
            "docs/architecture/THREAT-MODEL.md"
            "docs/policies/DEPENDENCY-POLICY.md"
            "docs/supply-chain/SUPPLY-CHAIN.md"
            "docs/ONBOARDING.md"
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ -f "$f" ]]; then
              echo "  ok   $f"
            else
              echo "  MISS $f"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::One or more required governance files are missing."
            exit 1
          fi
          echo "All required governance files present."

  python:
    name: Python (lint, types, tests, architecture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy type check
        run: uv run mypy contracts core apps/backend

      - name: Architecture (import-linter)
        run: uv run lint-imports

      - name: Tests + coverage
        run: uv run pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  js:
    name: JS/TS (install, lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version is read from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck workspaces
        run: pnpm -r --if-present typecheck

      - name: Test workspaces
        run: pnpm -r --if-present test

      - name: Lint workspaces (placeholders until M0-6)
        run: pnpm -r --if-present lint

  supply-chain:
    name: Supply chain (SBOM, audit, drift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Generate CycloneDX SBOM
        run: bash scripts/generate_sbom.sh

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-sbom
          path: sbom/python.cdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Python vulnerability audit (pip-audit)
        run: uv run pip-audit

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS workspace
        run: pnpm install --no-frozen-lockfile

      - name: JS vulnerability audit (pnpm audit)
        run: pnpm audit --audit-level high

      - name: Supply-chain drift check (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          bash scripts/check_supply_chain_drift.sh "origin/${{ github.base_ref }}"

  signing-smoke:
    name: Signing smoke (cosign)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Offline ephemeral-key sign + verify proves the signing toolchain works in CI without
      # touching the public Sigstore transparency log. Real releases use keyless signing
      # (see .github/workflows/release.yml and docs/development/releasing.md).
      - name: Sign and verify a test artifact (offline)
        run: bash scripts/signing_smoke.sh

  # NOTE: real release signing + SBOM attachment runs in .github/workflows/release.yml (M0-9).
