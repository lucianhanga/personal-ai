# PersonalAI - Python workspace root (uv virtual workspace).
# Members are the Python packages of the modular monolith. See ADR-0001 and
# docs/architecture/PersonalAI-Architecture-Research.md (Section 22).

[tool.uv.workspace]
members = ["contracts", "core", "apps/backend", "providers/ollama", "providers/openai_compat", "providers/whisper_local", "storage/postgres", "modalities/files", "tools/builtin", "tools/mcp", "benchmarks"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "httpx>=0.27",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.0",
    "detect-secrets>=1.5",
    "pre-commit>=3.7",
    "respx>=0.21",
    "fpdf2>=2.7",
    "types-jsonschema>=4.21",
]

# ---------------------------------------------------------------------------
# Ruff: lint + format (replaces black/isort/flake8).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["contracts/src", "core/src", "apps/backend/src", "providers/ollama/src", "providers/openai_compat/src", "storage/postgres/src", "modalities/files/src", "tools/builtin/src", "tools/mcp/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injectables are used as argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = [
    "personalai_contracts",
    "personalai_core",
    "personalai_backend",
    "personalai_provider_ollama",
    "personalai_provider_openai",
    "personalai_storage_postgres",
    "personalai_modality_files",
    "personalai_tool_builtin",
]

# ---------------------------------------------------------------------------
# mypy: strict-ish typing for the core contracts.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = ["contracts/src", "core/src", "apps/backend/src", "providers/ollama/src", "providers/openai_compat/src", "providers/whisper_local/src", "storage/postgres/src", "modalities/files/src", "tools/builtin/src", "tools/mcp/src", "benchmarks/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "faster_whisper.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

# OCR fallback deps (#450) ship no type stubs / py.typed marker.
[[tool.mypy.overrides]]
module = ["rapidocr_onnxruntime.*", "pypdfium2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest + coverage.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib --cov --cov-report=term-missing --cov-report=xml"
testpaths = ["contracts/tests", "core/tests", "apps/backend/tests", "providers/ollama/tests", "providers/openai_compat/tests", "storage/postgres/tests", "modalities/files/tests", "tools/builtin/tests", "tools/mcp/tests", "tools/markitdown-ollama/tests", "benchmarks/tests"]
filterwarnings = [
    # Third-party: starlette's TestClient warns to migrate to httpx2; tracked, not ours.
    "ignore:Using `httpx` with `starlette.testclient`.*",
]

[tool.coverage.run]
branch = true
source = [
    "personalai_contracts",
    "personalai_core",
    "personalai_backend",
    "personalai_provider_ollama",
    "personalai_provider_openai",
    "personalai_storage_postgres",
    "personalai_modality_files",
    "personalai_tool_builtin",
    "personalai_tool_mcp",
]

[tool.coverage.report]
show_missing = true
# Conservative gate at bootstrap; raised as real logic lands (see M0-7).
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
