[project]
name = "personalai-modality-files"
version = "0.0.0"
description = "PersonalAI file parsers (txt/markdown/pdf/docx) + chunking for ingestion."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lucian Hanga" }]
dependencies = ["personalai-contracts", "pypdf>=4.0", "python-docx>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personalai_modality_files"]

[tool.uv.sources]
personalai-contracts = { workspace = true }
