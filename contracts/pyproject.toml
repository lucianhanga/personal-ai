[project]
name = "personalai-contracts"
version = "0.0.0"
description = "PersonalAI stable core API: ports, schemas, and message/tool contracts."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lucian Hanga" }]
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personalai_contracts"]
