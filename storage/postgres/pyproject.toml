[project]
name = "personalai-storage-postgres"
version = "0.0.0"
description = "PersonalAI storage adapters for PostgreSQL + pgvector (asyncpg)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lucian Hanga" }]
dependencies = ["personalai-contracts", "asyncpg>=0.29", "langgraph-checkpoint>=4.1,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personalai_storage_postgres"]

[tool.uv.sources]
personalai-contracts = { workspace = true }
