          - heading "General" [level=3] [ref=e1212]
          - paragraph [ref=e1213]: This is the wind, wave and weather forecast for Waginger See in Bavaria, Germany. Windfinder specializes in wind, waves, tides and weather reports & forecasts for wind related sports like kitesurfing, windsurfing, surfing, sailing, fishing or paragliding.
          - heading "Forecast" [level=3] [ref=e1214]
          - paragraph [ref=e1215]: This forecast is based on the GFS model. Forecasts are available worldwide. The horizontal resolution is about 13 km. Forecasts are computed 4 times a day, at about 01:00, 07:00, 13:00 and 19:00 Central European Summer Time. Predictions are available in time steps of 6 hours for up to 10 days into the future. The arrows point in the direction in which the wind is blowing.
          - paragraph [ref=e1216]: Check the wind forecast for Waginger See when you search for the best travel destinations for your kiteboarding, windsurfing or sailing vacations in Germany. Or use our wind forecast to find the wind speed today in Waginger See or to have a look at the wind direction tomorrow at Waginger See.
          - heading "Statistics" [level=3] [ref=e1217]
