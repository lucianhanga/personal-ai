        - heading "Additional information" [level=2] [ref=e1790]
        - generic [ref=e1791]:
          - heading "General" [level=3] [ref=e1792]
          - paragraph [ref=e1793]: This is the wind, wave and weather forecast for Waginger See in Bavaria, Germany. Windfinder specializes in wind, waves, tides and weather reports & forecasts for wind related sports like kitesurfing, windsurfing, surfing, sailing, fishing or paragliding.
          - heading "Forecast" [level=3] [ref=e1794]
          - paragraph [ref=e1795]: This forecast is based on the GFS model. Forecasts are available worldwide. The horizontal resolution is about 13 km. Forecasts are computed 4 times a day, at about 01:00, 07:00, 13:00 and 19:00 Central European Summer Time. Predictions are available in time steps of 6 hours for up to 10 days into the future. The arrows point in the direction in which the wind is blowing.
          - paragraph [ref=e1796]: Check the wind forecast for Waginger See when you search for the best travel destinations for your kiteboarding, windsurfing or sailing vacations in Germany. Or use our wind forecast to find the wind speed today in Waginger See or to have a look at the wind direction tomorrow at Waginger See.
          - heading "Statistics" [level=3] [ref=e1797]
          - paragraph [ref=e1798]:
            - text: For statistical and historical real weather data see the
            - link "wind and weather statistics" [ref=e1799] [cursor=pointer]:
              - /url: /windstatistics/waginger_see
            - text: for this location.
          - heading "Severe Weather Warnings" [level=3] [ref=e1800]
          - paragraph [ref=e1801]: When a severe weather warning or advisory is provided by the local meteorological institute, we display it as a banner above the wind forecast.
          - paragraph [ref=e1802]:
            - text: The weather warning, for example a high wind warning, can help you prepare for dangerous weather conditions and avoid weather-related risks. The color scale indicates the intensity of the predicted weather event. For more details click or tap on the warning. General information about severe weather warnings can be found in our
            - link "help section" [ref=e1803] [cursor=pointer]:
              - /url: /help/usage/severe-weather-warnings
            - text: .
          - paragraph [ref=e1804]: Please be aware that severe weather may occur without a prior severe weather warning being reported.
          - heading "Units" [level=3] [ref=e1805]
          - paragraph [ref=e1806]:
            - text: We use knots and degrees Celsius as our default units. These units are often used by sailors, kiters, surfers, windsurfers and paragliders. Use website settings to switch between units and 7 different languages at any time. For converting between wind speed units such as knots, km/h (kilometers per hour), m/s (meters per second), and mph (miles per hour) use our
            - link "wind speed calculator" [ref=e1807] [cursor=pointer]:
              - /url: /wind/windspeed
            - text: .
