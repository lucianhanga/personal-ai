[project]
name = "personalai-core"
version = "0.0.0"
description = "PersonalAI core: orchestration, gateway, security engine, validation, registries."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lucian Hanga" }]
dependencies = ["personalai-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personalai_core"]

[tool.uv.sources]
personalai-contracts = { workspace = true }
