[project]
name = "personalai-core"
version = "0.0.0"
description = "PersonalAI core: orchestration, gateway, security engine, validation, registries."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lucian Hanga" }]
# httpx capped <0.29: the SSRF floor (security/ssrf.py) pins TLS via httpcore's `sni_hostname`
# request extension; cap so that contract can't change under a routine lock refresh without a
# deliberate bump + security re-review (CISO MF-1, #517).
dependencies = ["personalai-contracts", "jsonschema>=4.21", "langgraph>=1.2,<2", "httpx>=0.27,<0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personalai_core"]

[tool.uv.sources]
personalai-contracts = { workspace = true }
